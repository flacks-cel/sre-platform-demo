replicaCount: 1

image:
  repository: jobs-api
  tag: local
  pullPolicy: Never  # Kind local — image loaded via: kind load docker-image jobs-api:local --name sre-platform

service:
  type: ClusterIP
  port: 8000

serviceAccount:
  name: jobs-api  # created by Terraform

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

labels:
  app: jobs-api
  project: sre-platform-demo
