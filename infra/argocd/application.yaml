apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jobs-api
  namespace: argocd
  labels:
    project: sre-platform-demo
spec:
  project: default

  source:
    repoURL: https://github.com/flacks-cel/sre-platform-demo
    targetRevision: HEAD
    path: infra/helm/jobs-api
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: serviceMonitor.enabled
          value: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: app


  # The HPA owns the live replica count. Ignore this field so ArgoCD
  # does not report drift when autoscaling changes Deployment replicas.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: jobs-api
      namespace: app
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true      # remove recursos que não estão mais no Git
      selfHeal: true   # reverte mudanças manuais no cluster
    syncOptions:
      - CreateNamespace=false  # namespace já existe via Terraform
      - RespectIgnoreDifferences=true
