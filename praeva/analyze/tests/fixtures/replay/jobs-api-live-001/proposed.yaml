---
# Source: jobs-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  namespace: app
  labels:
    app: jobs-api
    project: sre-platform-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jobs-api
        project: sre-platform-demo
    spec:
      serviceAccountName: jobs-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: jobs-api
          image: "jobs-api:local"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
