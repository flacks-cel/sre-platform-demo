[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = [
    "app/api/tests",
    "praeva/verify/tests",
    "praeva/rules/tests",
    "praeva/change/tests",
    "praeva/risk/tests",
    "praeva/analyze/tests",
    "praeva/ownership/tests",
    "praeva/attribution/tests",
    # S9 is promoted to a mandatory regression by
    # CHANGE-RISK-001-POPULATION-GATE-001. Only this file: the rest of
    # experiments/ stays experimental and non-blocking.
    "experiments/praeva/spike-003/tests/test_risk_population.py",
]
pythonpath = [".", "app/api"]
