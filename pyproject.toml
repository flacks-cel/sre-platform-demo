[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = [
    "app/api/tests",
    "praeva/verify/tests",
    "praeva/rules/tests",
    "praeva/change/tests",
    "praeva/risk/tests",
]
pythonpath = [".", "app/api"]
